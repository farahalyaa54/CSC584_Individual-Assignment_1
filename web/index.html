<html>
    <head>
        <title>Personal Profile</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="container">
            
        <h1>Personal Profile Form</h1>
        <p>Please fill in your personal information below.</p>

        <form action="ProfileServlet" method="post">
            
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="studentId">Student ID:</label><br>
            <input type="text" id="studentId" name="studentId">
            <br><br>

            <label for="programme">Programme:</label><br>
            <input type="text" id="programme" name="programme">
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="hobbies">Hobbies:</label><br>
            <input type="text" id="hobbies" name="hobbies">
            <br><br>

            <label for="introduction">Short Self-Introduction:</label><br>
            <textarea id="introduction" name="introduction" rows="5" cols="40"></textarea>
            <br><br>
            
            <button type="submit">Submit Profile</button>
            
        </form>
        
        </div>
        
    </body>
    
</html>
